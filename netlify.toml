[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["firebase-admin"]

# CORS headers for all function responses (fixes OPTIONS preflight in local dev)
[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Headers = "Content-Type, x-user-id"
    Access-Control-Allow-Methods = "GET, POST, PUT, DELETE, OPTIONS"

# Cache headers for API responses (Feature 37)
[[headers]]
  for = "/.netlify/functions/routes-trains"
  [headers.values]
    Cache-Control = "public, max-age=30, s-maxage=30"

[[headers]]
  for = "/api/v1/trains"
  [headers.values]
    Cache-Control = "public, max-age=30, s-maxage=30"
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type"

[[headers]]
  for = "/api/v1/stops"
  [headers.values]
    Cache-Control = "public, max-age=300, s-maxage=600"
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type"

[[headers]]
  for = "/.netlify/functions/routes-list"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/.netlify/functions/schedules-list"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/.netlify/functions/stops-search"
  [headers.values]
    Cache-Control = "public, max-age=300, s-maxage=600"

# Compression is enabled by default on Netlify (Feature 41)
# Static assets get brotli/gzip automatically

[[redirects]]
  from = "/api/v1/trains"
  to = "/.netlify/functions/routes-trains"
  status = 200

[[redirects]]
  from = "/api/v1/stops"
  to = "/.netlify/functions/stops-search"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
